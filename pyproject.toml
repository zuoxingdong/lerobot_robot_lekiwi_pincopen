[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# The distribution name MUST keep the lerobot_robot_ prefix and match the import
# package name exactly: lerobot's register_third_party_plugins() discovers installed
# distributions by that prefix and then imports the distribution name as a module.
# (setuptools preserves the underscore Name in metadata; a backend that normalizes
# it to hyphens would break discovery.)
name = "lerobot_robot_lekiwi_pincopen"
version = "0.1.1"
description = "PincOpen LeKiwi (STS3250 heavy arm joints + PincOpen gripper) as a LeRobot third-party robot plugin"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Xingdong Zuo" }]
# lerobot has required 3.12 since 0.5.0, so with a >=0.6.0 floor this package can never
# install on 3.10/3.11. Claiming otherwise only turns a clear "requires Python >=3.12"
# into a confusing resolver failure about lerobot.
requires-python = ">=3.12"
keywords = ["lerobot", "robotics", "lekiwi", "plugin", "feetech"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Requires lerobot 0.6.0 or newer; the lekiwi extra brings the servo SDK the bus needs
# plus pyzmq for the host. In an env that already carries an (editable) lerobot clone
# this resolves as already-satisfied.
dependencies = ["lerobot[lekiwi]>=0.6.0"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
]

[project.urls]
Repository = "https://github.com/zuoxingdong/lerobot_robot_lekiwi_pincopen"

[tool.setuptools.packages.find]
include = ["lerobot_robot_lekiwi_pincopen*"]

[tool.ruff]
target-version = "py312"
line-length = 110

# Select the rule set explicitly. Left implicit, the enabled rules are whatever the
# installed ruff defaults to, so a new ruff release changes what CI enforces without
# anything in this repo changing (0.16 widened the defaults and broke a green build).
[tool.ruff.lint]
select = [
    "E4", # imports
    "E7", # statements
    "E9", # runtime errors
    "F",  # pyflakes
    "I",  # import sorting
    "RUF", # ruff-specific (sorted __all__, stale noqa, ...)
]

[tool.ruff.lint.per-file-ignores]
# The test imports deliberately sit below `pytest.importorskip("lerobot")` so the suite
# skips cleanly in an env without lerobot. Ruff >=0.7 understands that and treats an
# inline `noqa: E402` as stale (RUF100), while older ruff still raises E402 without one,
# so no inline comment satisfies both. Ignoring it here does.
"tests/*" = ["E402"]
